# Force-redirect all secondary/www domains to the canonical primary.
# Primary: https://kozlowskifinancial.com
# force = true means these fire even when a real file exists at the path.

[[redirects]]
  from = "https://kozfinancial.com/*"
  to = "https://kozlowskifinancial.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.kozfinancial.com/*"
  to = "https://kozlowskifinancial.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.kozlowskifinancial.com/*"
  to = "https://kozlowskifinancial.com/:splat"
  status = 301
  force = true

# Security headers for every page.
# CSP allows the Tailwind play CDN and inline <script>/<style> because the pages use both.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
